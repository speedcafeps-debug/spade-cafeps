<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>SPADE Café & PlayStation</title>
<style>
:root{--red:#ff1238;--dark:#080808;--panel:#141414;--white:#f7f7f7}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#29030b 0%,#080808 55%);color:var(--white);font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px 15px 40px}
.hero{text-align:center;padding:26px 12px 20px;border:1px solid #ff123866;border-radius:22px;background:linear-gradient(145deg,#160307,#090909 65%);box-shadow:0 0 28px #ff123822}
.logo{font-size:clamp(38px,9vw,72px);font-weight:1000;letter-spacing:3px;color:#ff183d;text-shadow:0 0 9px #ff1238,0 0 26px #a9001d;margin:0}
.sub{letter-spacing:3px;color:#eee;font-size:14px;margin-top:2px}
.tag{color:#bbb;margin:13px 0 0;font-size:13px;letter-spacing:2px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}
.action{display:block;text-decoration:none;text-align:center;padding:25px 10px;border:1px solid var(--red);border-radius:16px;background:linear-gradient(145deg,#22040a,#111);color:white;box-shadow:inset 0 0 18px #ff123811,0 0 14px #ff123822;transition:.2s}
.action b{display:block;color:var(--red);font-size:clamp(23px,5vw,32px);letter-spacing:1px}
.action span{display:block;font-size:12px;color:#ccc;margin-top:8px}
section{scroll-margin-top:12px;margin-top:22px}
.heading{font-size:22px;color:var(--red);border-bottom:1px solid #ff123866;padding:12px 2px;margin-bottom:14px}
.menuimg{display:block;width:100%;height:auto;border:1px solid #ff123866;border-radius:13px;margin:12px 0;box-shadow:0 0 18px #ff123815}
.socials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.social{color:#fff;text-decoration:none;background:#151515;border:1px solid #ff123855;border-radius:12px;padding:15px;text-align:center;font-weight:bold}
.social:hover,.action:hover{box-shadow:0 0 24px #ff123855}
.call{display:block;text-align:center;color:#fff;background:#d9092b;border-radius:12px;padding:16px;text-decoration:none;font-weight:bold;margin-top:12px}
.note{color:#999;text-align:center;font-size:12px;margin-top:25px}
@media(max-width:480px){.wrap{padding:12px}.cards{gap:9px}.action{padding:21px 6px}.socials{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <h1 class="logo">♠ SPADE</h1>
  <div class="sub">CAFÉ &amp; PLAYSTATION</div>
  <p class="tag">PLAY • EAT • DRINK • ENJOY</p>
</header>
<nav class="cards">
  <a class="action" href="#menu"><b>MENU</b><span>المشروبات والأسعار</span></a>
  <a class="action" href="#pages"><b>OUR PAGES</b><span>تابعنا وتواصل معانا</span></a>
</nav>
<section id="menu">
  <h2 class="heading">♠ المنيو والأسعار | MENU</h2>
  <img class="menuimg" src="menu-drinks.png" alt="منيو المشروبات والأسعار" loading="lazy">
  <img class="menuimg" src="menu-rooms.png" alt="أسعار غرف البلايستيشن والـ VIP والسينما" loading="lazy">
</section>
<section id="pages">
  <h2 class="heading">♠ OUR PAGES</h2>
  <div class="socials">
    <a class="social" href="https://www.facebook.com/share/19sGfCME8q/" target="_blank" rel="noopener">Facebook ↗</a>
    <a class="social" href="https://www.instagram.com/spadecafeps?psln=MTRxdmtvanU5ejZtcQ==" target="_blank" rel="noopener">Instagram ↗</a>
    <a class="social" href="https://www.tiktok.com/@spadecafeps?_r=1&_t=ZS-9AkRLZhUORA" target="_blank" rel="noopener">TikTok ↗</a>
    <a class="social" href="tel:01094956163">اتصل بينا ☎</a>
  </div>
  <a class="call" href="tel:01094956163">اتصل الآن — 01094956163</a>
</section>
<p class="note">SPADE Café &amp; PlayStation · More than a game ♠</p>
</div>
</body>
</html>
